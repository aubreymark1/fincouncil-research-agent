name: tests

on:
  push:
    branches:
      - main
      - role-a-core
      - role-b-ingestion
      - role-c-industry
      - role-d-eval-ui
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run all tests
        run: pytest tests/core tests/ingestion tests/industry tests/evaluation -q
