# 冻结的实验定义（D-003）
#
# 所有实验使用相同资料包、cutoff 和报告模板。
# E1—E3 额外保持相同模型、temperature 和提示词版本。
# 运行后不得根据结果改组。
#
# E0 是人工基线：不调用模型，由指定成员使用同一资料包完成人工简报，
# 通过 scripts/evaluate.py --case {case_id} --experiment E0 --import-manual 导入，
# 记录开始时间、结束时间、使用资料和最终文本。
#
# 状态说明（2026-08-27）：
# - food_main/bank_main 的真实 Gold (food_gold.json/bank_gold.json) 尚未签收（D-001 进行中），
#   gold_path 显式置 null，E0—E3 当前不可评分，CLI 会给出 "gold_missing" 状态。
# - bank_main 的 ResearchRequest (fixtures/shared/bank_request.json) 已补齐，
#   case 标记 enabled: true；真实 Gold 仍未签收，gold_path 仍为 null。
# - E1/E2/E3 的 run_command 已接通 --mode 与 --llm；在真实 Gold 签收前，
#   E1/E2/E3 仍显式标记 enabled: false，run_case_experiments / CLI 会跳过并给出
#   "disabled" 状态，不把三组实验视为可正式评分。

schema_version: "1.0"

cases:
  - case_id: food_main
    request_path: fixtures/shared/research_request.json
    gold_path: null
    enabled: true
  - case_id: bank_main
    request_path: fixtures/shared/bank_request.json
    gold_path: null
    enabled: true

experiments:
  E0:
    name: manual_baseline
    description: 人工检索和整理；不调用模型
    run_command: null
    enabled: true
  E1:
    name: generic_agent
    description: 通用 Agent，不加载行业配置（Gold 签收前 disabled）
    run_command: "{python} scripts/run_case.py --request {request_path} --mode E1 --llm"
    enabled: false
  E2:
    name: industry_agent
    description: 通用 Agent 加载行业配置（Gold 签收前 disabled）
    run_command: "{python} scripts/run_case.py --request {request_path} --mode E2 --llm"
    enabled: false
  E3:
    name: full_system
    description: 行业配置、时间锁、证据链和 Critic（Gold 签收前 disabled）
    run_command: "{python} scripts/run_case.py --request {request_path} --mode E3 --llm"
    enabled: false

output:
  root: outputs/experiments
  files:
    request: request.json
    report: report.json
    metadata: run_metadata.json
    metrics: metrics.json
    error: error.txt
